spring.application.name=task-manager-api-test
# Tests never import the private local configuration or use the development database.
spring.datasource.url=${TEST_DB_URL:jdbc:h2:mem:taskmanager;MODE=PostgreSQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${TEST_DB_USERNAME:sa}
spring.datasource.password=${TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${TEST_DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
api.security.token.secret=test-only-secret-with-at-least-32-bytes-not-for-deployment
